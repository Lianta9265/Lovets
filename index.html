<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ловец исключений</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#021321;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:url('https://img.genially.com/6745c9e1b8c72e0015ffbab6/fb5d0c0a-f354-4f5e-b800-ef61a5b22e27.jpeg') center/cover no-repeat;
}

#startScreen{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.65);
}

.startBox{
    width:min(90vw,700px);
    padding:35px;
    border-radius:25px;
    text-align:center;
    background:rgba(0,20,35,0.88);
    border:3px solid #00eaff;
    box-shadow:0 0 25px #00eaff;
    color:white;
}

.startBox h1{
    font-size:clamp(26px,4vw,50px);
    margin-bottom:20px;
    color:#ffd36b;
}

.startBox p{
    font-size:clamp(18px,2vw,30px);
    line-height:1.4;
    margin-bottom:25px;
}

button{
    padding:14px 34px;
    border:none;
    border-radius:50px;
    font-size:clamp(18px,2vw,28px);
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(45deg,#00f0ff,#ffd36b);
    color:#021321;
    box-shadow:0 0 18px rgba(0,234,255,.65);
}

button:hover{
    transform:scale(1.04);
}

#scoreBox{
    position:absolute;
    top:15px;
    left:15px;
    z-index:50;
    padding:12px 18px;
    border-radius:50px;
    background:rgba(0,0,0,0.55);
    border:2px solid #00eaff;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#progressBox{
    position:absolute;
    top:15px;
    right:15px;
    z-index:50;
    padding:12px 18px;
    border-radius:50px;
    background:rgba(0,0,0,0.55);
    border:2px solid #ffd36b;
    color:white;
    font-size:24px;
    font-weight:bold;
}

#speedBox{
    position:absolute;
    left:15px;
    bottom:15px;
    z-index:50;
    padding:10px 14px;
    border-radius:18px;
    background:rgba(0,0,0,0.58);
    border:2px solid #00eaff;
    color:white;
    font-size:18px;
    font-weight:bold;
    display:flex;
    align-items:center;
    gap:10px;
}

#speedRange{
    width:130px;
    accent-color:#00eaff;
}

#speedValue{
    min-width:45px;
    color:#ffd36b;
}

#fisherman{
    scale:-1 1;
    position:absolute;
    left:0;
    top:50%;
    transform:translateY(-50%);
    width:165px;
    z-index:20;
    pointer-events:none;
}

.fish{
    position:absolute;
    width:155px;
    z-index:10;
    transition:opacity .25s;
}

.fish img{
    width:100%;
    display:block;
}

.word{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-weight:bold;
    text-align:center;
    width:88%;
    font-size:18px;
    text-shadow:0 0 5px black, 0 0 8px black;
}

#endScreen{
    position:absolute;
    inset:0;
    z-index:120;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.75);
}

.endBox{
    width:min(90vw,700px);
    padding:35px;
    border-radius:25px;
    text-align:center;
    background:rgba(0,20,35,0.9);
    border:3px solid #00eaff;
    color:white;
    box-shadow:0 0 25px #00eaff;
}

.endBox h2{
    font-size:clamp(34px,5vw,50px);
    margin-bottom:20px;
    color:#ffd36b;
}

#portal{
    width:220px;
    margin-top:15px;
    display:block;
    margin-left:auto;
    margin-right:auto;
    filter:drop-shadow(0 0 20px #00eaff);
}

#restartBtn{
    margin-top:18px;
}

#message{
    position:absolute;
    top:90px;
    left:50%;
    transform:translateX(-50%);
    z-index:60;
    padding:12px 20px;
    border-radius:20px;
    background:rgba(0,0,0,0.65);
    color:white;
    font-size:24px;
    font-weight:bold;
    display:none;
    text-align:center;
}
</style>
</head>

<body>

<div id="game">

    <div id="scoreBox">
        🎣 Счёт: <span id="score">0</span>
    </div>

    <div id="progressBox">
        🐟 <span id="caughtCount">0</span> / 20
    </div>

    <div id="speedBox">
        ⚙️ Скорость:
        <input id="speedRange" type="range" min="0.6" max="2.8" step="0.1" value="1">
        <span id="speedValue">1.0×</span>
    </div>

    <div id="message"></div>

    <img id="fisherman"
    src="https://img.genially.com/6745c9e1b8c72e0015ffbab6/c1aa7cc6-8821-49f1-addf-9d0977322625.gif">

    <div id="startScreen">
        <div class="startBox">
            <h1>Ловец исключений</h1>

            <p>
            Лови рыбок с исключениями из правил
            чередования в корне.<br><br>
            Готов закинуть удочку?
            </p>

            <button id="startBtn">Готов</button>
        </div>
    </div>

    <div id="endScreen">
        <div class="endBox">

            <h2>Портал открыт!</h2>

            <p style="font-size:30px;">
                Твой счёт:
                <span id="finalScore">0</span>
            </p>

            <img id="portal"
            src="https://media.tenor.com/issBU8dcLyIAAAAi/portal.gif">

            <button id="restartBtn">Играть снова</button>

        </div>
    </div>

</div>

<script>

const fishImages = [
'https://img.genially.com/6745c9e1b8c72e0015ffbab6/94e42c1b-435a-4248-8305-7ee8b7c94bf0.png',
'https://img.genially.com/6745c9e1b8c72e0015ffbab6/f3c67212-2369-4fe6-b984-5da7c9e18070.png',
'https://img.genially.com/6745c9e1b8c72e0015ffbab6/3f941e7c-368d-4ea4-8b07-e7715f41db95.png',
'https://img.genially.com/6745c9e1b8c72e0015ffbab6/636d68bc-6560-452d-bdc6-4bfd068a98e2.png',
'https://img.genially.com/6745c9e1b8c72e0015ffbab6/0ba22d66-f405-4dd5-b3ec-c52ac9ecb905.png'
];

const correctWords = [
'Сочетание',
'Пловец',
'Утварь',
'Отрасли',
'Обжиг',
'Изгарь',
'Росток',
'Ровесник',
'Скачок',
'Пригарь'
];

const wrongWords = [
'Отросли',
'Вычитать',
'Выжигать',
'Растение',
'Заросли',
'Поросль',
'Уравнение',
'Плавники',
'Плавучий',
'Творение'
];

let allFish = [];
let fishQueue = [];
let score = 0;
let processed = 0;
let spawned = 0;
let started = false;
let animationId = null;
let lastSpawnTime = 0;
let speedMultiplier = 1;

const TOTAL_FISH = 20;
const FISHER_WIDTH = 165;
const FISH_WIDTH = 155;

// Главные настройки движения:
// spawnDelay — пауза между появлением рыбок.
// minHorizontalGap — расстояние по горизонтали между рыбками.
// minVerticalGap — расстояние по вертикали между дорожками.
const spawnDelay = 1850;
const minHorizontalGap = FISHER_WIDTH + 210;
const minVerticalGap = FISHER_WIDTH + 55;

const game = document.getElementById('game');
const fisherman = document.getElementById('fisherman');
const scoreEl = document.getElementById('score');
const caughtCountEl = document.getElementById('caughtCount');
const finalScore = document.getElementById('finalScore');
const message = document.getElementById('message');
const startScreen = document.getElementById('startScreen');
const endScreen = document.getElementById('endScreen');
const speedRange = document.getElementById('speedRange');
const speedValue = document.getElementById('speedValue');

function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
}

function showMessage(text,color){
    message.innerText=text;
    message.style.display='block';
    message.style.border='2px solid '+color;

    setTimeout(()=>{
        message.style.display='none';
    },1000);
}

function updateHud(){
    scoreEl.innerText = score;
    caughtCountEl.innerText = processed;
}

function getSafeLanes(){
    const topLimit = 115;
    const bottomLimit = Math.max(topLimit, window.innerHeight - 150);
    const lanes = [];

    for(let y = topLimit; y <= bottomLimit; y += minVerticalGap){
        lanes.push(y);
    }

    if(lanes.length < 2){
        lanes.push(window.innerHeight * 0.55);
    }

    return lanes;
}

function resetBeforeStart(){
    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    allFish.forEach(fish=>{
        if(fish.el && fish.el.parentNode){
            fish.el.remove();
        }
    });

    allFish = [];
    fishQueue = [];
    score = 0;
    processed = 0;
    spawned = 0;
    started = false;
    lastSpawnTime = 0;
    updateHud();
    message.style.display = 'none';
    endScreen.style.display = 'none';

    fisherman.style.left = '0px';
    fisherman.style.top = '50%';
    fisherman.style.transform = 'translateY(-50%)';
}

function resetGame(){
    resetBeforeStart();
    startScreen.style.display = 'flex';
}

function chooseLane(){
    const lanes = shuffle(getSafeLanes());

    for(const lane of lanes){
        const laneIsFree = allFish.every(fish => {
            if(fish.caught) return true;
            const sameLane = Math.abs(fish.y - lane) < minVerticalGap * 0.72;
            const tooCloseToStart = fish.x > window.innerWidth - minHorizontalGap;
            return !(sameLane && tooCloseToStart);
        });

        if(laneIsFree) return lane;
    }

    return null;
}

function canSpawnNow(){
    if(fishQueue.length === 0) return false;

    const tooCloseHorizontally = allFish.some(fish => {
        if(fish.caught) return false;
        return fish.x > window.innerWidth - minHorizontalGap;
    });

    return !tooCloseHorizontally;
}

function createFish(item,index){
    const lane = chooseLane();

    if(lane === null) return false;

    const fish=document.createElement('div');
    fish.className='fish';

    fish.innerHTML=`
        <img src="${fishImages[index % fishImages.length]}">
        <div class="word">${item.word}</div>
    `;

    fish.dataset.correct=item.correct;

    const x = window.innerWidth + 180;
    const y = lane;

    fish.style.left = x + 'px';
    fish.style.top = y + 'px';

    game.appendChild(fish);

    // Скорость умеренная: быстрее прежней, но слова остаются читаемыми.
    const speed = 1.05 + Math.random() * 0.25;

    allFish.push({
        el:fish,
        x:x,
        y:y,
        speed:speed,
        correct:item.correct,
        caught:false
    });

    spawned++;
    return true;
}

function trySpawn(time){
    if(!started) return;
    if(fishQueue.length === 0) return;
    if(time - lastSpawnTime < spawnDelay) return;
    if(!canSpawnNow()) return;

    const item = fishQueue.shift();
    const created = createFish(item, spawned);

    if(created){
        lastSpawnTime = time;
    }else{
        fishQueue.unshift(item);
    }
}

function startGame(){
    resetBeforeStart();
    started = true;
    startScreen.style.display = 'none';

    fishQueue = shuffle([
        ...correctWords.map(w=>({word:w,correct:true})),
        ...wrongWords.map(w=>({word:w,correct:false}))
    ]);

    lastSpawnTime = performance.now() - spawnDelay;
    animate(performance.now());
}

function processFish(fish, messageText, color, addScore){
    if(fish.caught) return;

    fish.caught = true;
    processed++;
    score += addScore;
    updateHud();

    if(messageText){
        showMessage(messageText,color);
    }

    fish.el.style.opacity='0';

    setTimeout(()=>{
        if(fish.el && fish.el.parentNode){
            fish.el.remove();
        }
    },250);

    if(processed >= TOTAL_FISH){
        finishGame();
    }
}

function animate(time){
    if(!started) return;

    trySpawn(time);

    const fisherRect = fisherman.getBoundingClientRect();

    allFish.forEach(fish=>{
        if(!fish.el || fish.caught) return;

      fish.x -= fish.speed * speedMultiplier;

// лёгкое плавание вверх-вниз
const wave =
    Math.sin((fish.x + fish.y) * 0.02) * 12;

fish.el.style.left = fish.x + 'px';
fish.el.style.top = (fish.y + wave) + 'px';

        const rect = fish.el.getBoundingClientRect();

        // Ловля считается только кончиком удочки,
        // а не всей фигурой рыбака.
        const hookX = fisherRect.right - 18;
        const hookY = fisherRect.top + fisherRect.height * 0.62;

        const fishCenterX = rect.left + rect.width * 0.5;
        const fishCenterY = rect.top + rect.height * 0.5;

        const dx = hookX - fishCenterX;
        const dy = hookY - fishCenterY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        // Радиус ловли.
        const collision = distance < 45;

        if(collision){
            if(fish.correct){
                processFish(fish, 'Верно! Это исключение', '#00ffff', 1);
            }else{
                processFish(fish, 'Это НЕ исключение', '#ff5edc', -1);
            }
        }else if(rect.right < -30){
            processFish(fish, '', '#ffffff', 0);
        }
    });

    allFish = allFish.filter(fish => !fish.caught || (fish.el && fish.el.parentNode));

    animationId = requestAnimationFrame(animate);
}

function finishGame(){
    started=false;

    if(animationId){
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    finalScore.innerText=score;

    setTimeout(()=>{
        endScreen.style.display='flex';
    },500);
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('restartBtn').onclick=resetGame;

speedRange.addEventListener('input',()=>{
    speedMultiplier = Number(speedRange.value);
    speedValue.innerText = speedMultiplier.toFixed(1) + '×';
});

game.addEventListener('mousemove',(e)=>{
    if(!started)return;

    fisherman.style.left = (e.clientX - 138) + 'px';
    fisherman.style.top = (e.clientY - 82) + 'px';
    fisherman.style.transform = 'none';
});

game.addEventListener('touchmove',(e)=>{
    if(!started)return;

    e.preventDefault();

    const touch=e.touches[0];

    fisherman.style.left = (touch.clientX - 138) + 'px';
    fisherman.style.top = (touch.clientY - 82) + 'px';
    fisherman.style.transform = 'none';

},{passive:false});

</script>

</body>
</html>
